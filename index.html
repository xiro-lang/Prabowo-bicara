<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  background: #000;
}
</style>
</head>
<body>
<video id="video" autoplay loop playsinline>
  <source src="prabowo_bicara.mp4" type="video/mp4">
</video>
<script>
const video = document.getElementById("video");
video.volume = 1;
video.loop = true;
video.autoplay = true;
video.playsInline = true;

async function attemptPlayWithSound() {
  video.muted = false;
  video.volume = 1;
  try {
    await video.play();
  } catch (error) {
    // Browser may block autoplay with sound. Try muted autoplay.
    video.muted = true;
    try { await video.play(); } catch (e) {}
  }
}
attemptPlayWithSound();

function unlockSound() {
  video.muted = false;
  video.volume = 1;
  video.play().catch(() => {});
}
document.addEventListener("touchstart", unlockSound, { once: true, passive: true });
document.addEventListener("click", unlockSound, { once: true });
</script>
</body>
</html>
